spring.application.name=MyWallet
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost;databaseName=mywallet;TrustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Nesher#2019
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.flyway.enabled=true
spring.flyway.url=jdbc:sqlserver://localhost;databaseName=mywallet;TrustServerCertificate=true
spring.flyway.user=sa
spring.flyway.password=Nesher#2019
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

