<div class="cad-receita-container">
  <div class="header">
    <div class="value-section">
      <p>Valor:</p>
      <h2>R$ 0,00</h2>
    </div>
    <div class="header-buttons">
      <button class="check-btn">&#10003;</button>
      <button class="close-btn">&#10006;</button>
    </div>
  </div>

  <form>
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" name="titulo">

    <label>Data:</label>
    <div class="date-buttons">
      <button type="button">HOJE</button>
      <button type="button">ONTEM</button>
      <button type="button">SELECIONAR DATA</button>
    </div>

    <label for="categoria">Categoria:</label>
    <select id="categoria" name="categoria">
      <option value="1">Categoria</option>
    </select>

    <label for="sub-categoria">Sub-Categoria:</label>
    <select id="sub-categoria" name="sub-categoria">
      <option value="1">Sub-Categoria</option>
    </select>

    <label for="conta-cartao">Conta ou Cartão:</label>
    <select id="conta-cartao" name="conta-cartao">
      <option value="1">Conta ou Cartão</option>
    </select>

    <label>Lançamento:</label>
    <div class="launch-type-buttons">
      <button type="button">ÚNICO</button>
      <button type="button">RECORRENTE</button>
      <button type="button">PARCELADO</button>
    </div>
  </form>
</div>
