<html>
<div class="cadastro-conta-bancaria-form">
  <h2>Cadastrar Conta Bancária</h2>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessages.length > 0" class="alert alert-danger">
    <ul>
      <li *ngFor="let errorMessage of errorMessages">{{ errorMessage }}</li>
    </ul>
  </div>

  <form (ngSubmit)="salvarContaBancaria()">
    <div class="form-group">
      <label for="nomeBanco">Nome do Banco:</label>
      <input type="text" [(ngModel)]="contaBancaria.nome" name="nomeBanco" id="nomeBanco" required>
    </div>

    <div class="form-group">
      <label for="saldo">Saldo Inicial:</label>
      <input type="number" [(ngModel)]="contaBancaria.saldo" name="saldo" id="saldo" required>
    </div>

    <button type="submit" class="submit-btn">Salvar Conta Bancária</button>
  </form>
</div>
</html>
