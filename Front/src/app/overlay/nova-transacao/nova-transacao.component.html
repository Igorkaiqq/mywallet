<div class="overlay-container">
  <div class="header">
    <h2>Nova Movimentação</h2>
    <button mat-icon-button (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="movimentacaoForm" class="form-container">
    <mat-form-field appearance="fill">
      <input matInput formControlName="descricao" placeholder="Descrição" required />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <input matInput formControlName="valor" type="number" placeholder="Valor" required />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <input matInput formControlName="data" type="date" placeholder="Data" required />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-select formControlName="categoria" placeholder="Categoria" required>
        <mat-option *ngFor="let categoria of categorias" [value]="categoria">
          {{ categoria }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="movimentacaoForm.invalid">
      Concluir
    </button>
  </form>
</div>
