<h2 mat-dialog-title>Editar Nome</h2>
<div mat-dialog-content>
  <form [formGroup]="editForm">
    <mat-form-field appearance="fill">
      <mat-label>Novo Nome</mat-label>
      <input matInput formControlName="name" (keypress)="apenasLetras($event)" />
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-button class="cancel-button" (click)="onCancel()">Cancelar</button>
  <button mat-button class="save-button" color="primary" (click)="onSave()">Salvar</button>
</div>
